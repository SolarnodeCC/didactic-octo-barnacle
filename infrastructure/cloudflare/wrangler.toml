# Cloudflare Worker bindings for the research pipeline (ADR 0004, ADR 0020).
# The collector Worker in apps/pipeline (src/worker.ts) uses these resources.
name = "roi-pipeline"
main = "../../apps/pipeline/src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The Worker is driven by cron and queues only. No workers.dev address, no preview URLs
# (REQ-NFR-021); environments inherit both settings.
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "local"

[[d1_databases]]
binding = "DB"
database_name = "roi-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "roi-documents-local"

[[queues.producers]]
binding = "PUBLICATION_QUEUE"
queue = "roi-publications-local"

[[queues.consumers]]
queue = "roi-publications-local"
max_batch_size = 1
max_concurrency = 1
max_retries = 3
dead_letter_queue = "roi-publications-dlq-local"

# The dead-letter queue is consumed by the same Worker (REQ-DATA-011).
[[queues.consumers]]
queue = "roi-publications-dlq-local"
max_batch_size = 1
max_retries = 1

[env.preview]
name = "roi-pipeline-preview"
vars = { ENVIRONMENT = "preview" }

[[env.preview.d1_databases]]
binding = "DB"
database_name = "roi-preview"
database_id = "REPLACE_WITH_PREVIEW_D1_ID"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "roi-documents-preview"

[[env.preview.queues.producers]]
binding = "PUBLICATION_QUEUE"
queue = "roi-publications-preview"

[[env.preview.queues.consumers]]
queue = "roi-publications-preview"
max_batch_size = 1
max_concurrency = 1
max_retries = 3
dead_letter_queue = "roi-publications-dlq-preview"

# The dead-letter queue is consumed by the same Worker (REQ-DATA-011).
[[env.preview.queues.consumers]]
queue = "roi-publications-dlq-preview"
max_batch_size = 1
max_retries = 1

[env.staging]
name = "roi-pipeline-staging"
vars = { ENVIRONMENT = "staging", ALERT_GITHUB_REPO = "SolarnodeCC/didactic-octo-barnacle", ALERT_EMAIL_FROM = "onboarding@resend.dev" }

[env.staging.triggers]
crons = ["0 6 * * *", "30 7 * * *"]

# Keep the structured log lines (REQ-NFR-008) so a run can be followed afterwards.
[env.staging.observability]
enabled = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "roi-staging"
database_id = "e613e0ae-e79e-43c4-83e1-a44eb7307c7e"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "roi-documents-staging"

[[env.staging.queues.producers]]
binding = "PUBLICATION_QUEUE"
queue = "roi-publications-staging"

[[env.staging.queues.consumers]]
queue = "roi-publications-staging"
max_batch_size = 1
max_concurrency = 1
max_retries = 3
dead_letter_queue = "roi-publications-dlq-staging"

# The dead-letter queue is consumed by the same Worker (REQ-DATA-011).
[[env.staging.queues.consumers]]
queue = "roi-publications-dlq-staging"
max_batch_size = 1
max_retries = 1

[env.production]
name = "roi-pipeline-production"
vars = { ENVIRONMENT = "production", ALERT_GITHUB_REPO = "SolarnodeCC/didactic-octo-barnacle" }

[env.production.triggers]
crons = ["0 6 * * *", "30 7 * * *"]

# Keep the structured log lines (REQ-NFR-008) so a run can be followed afterwards.
[env.production.observability]
enabled = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "roi-production"
database_id = "REPLACE_WITH_PRODUCTION_D1_ID"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "roi-documents-production"

[[env.production.queues.producers]]
binding = "PUBLICATION_QUEUE"
queue = "roi-publications-production"

[[env.production.queues.consumers]]
queue = "roi-publications-production"
max_batch_size = 1
max_concurrency = 1
max_retries = 3
dead_letter_queue = "roi-publications-dlq-production"

# The dead-letter queue is consumed by the same Worker (REQ-DATA-011).
[[env.production.queues.consumers]]
queue = "roi-publications-dlq-production"
max_batch_size = 1
max_retries = 1
