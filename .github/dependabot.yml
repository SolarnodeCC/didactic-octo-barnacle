version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Wait a week after a release, so a hijacked version is found before it is proposed (ADR 0074).
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: "/scripts"
    schedule:
      interval: weekly
    # Wait a week after a release, so a hijacked version is found before it is proposed (ADR 0074).
    cooldown:
      default-days: 7
  # pnpm workspaces are read through the npm ecosystem at the root (REQ-NFR-021).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Wait a week after a release, so a hijacked version is found before it is proposed (ADR 0074).
    cooldown:
      default-days: 7
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
