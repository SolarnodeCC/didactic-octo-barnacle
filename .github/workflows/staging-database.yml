name: Staging database

# Manual run for the staging D1 database (REQ-NFR-020, ADR 0020). It lists the
# migrations that are not applied yet; with `apply` it applies them in order.
# The job uses the GitHub environment `staging`, whose secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are listed in
# docs/kt/operations.md.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply pending migrations (otherwise only list them)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-database
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: List pending migrations
        working-directory: infrastructure/cloudflare
        run: pnpm exec wrangler d1 migrations list DB --env staging --remote

      - name: Apply migrations
        if: ${{ inputs.apply }}
        working-directory: infrastructure/cloudflare
        run: pnpm exec wrangler d1 migrations apply DB --env staging --remote
