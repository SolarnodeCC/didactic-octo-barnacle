name: Staging scheduled checks

# Weekly read-only checks of staging (REQ-NFR-020, ADR 0032, ADR 0046): infrastructure drift
# and the phase 1 measurements. They use the GitHub environment `staging`, which has no
# required reviewers (the pull request approval is the gate, ADR 0046).
# A failure opens a GitHub issue labeled `alert`, or comments on the one that is open.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-scheduled
  cancel-in-progress: false

jobs:
  drift:
    permissions:
      contents: read
    uses: ./.github/workflows/staging-bootstrap.yml
    with:
      apply: false
      fail_on_drift: true

  measure:
    permissions:
      contents: read
    uses: ./.github/workflows/staging-measure.yml
    with:

  alert:
    needs: [drift, measure]
    if: ${{ always() && (needs.drift.result == 'failure' || needs.measure.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Staging scheduled checks failed"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label alert --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          body="The weekly staging checks failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label alert --title "$title" --body "$body"
          fi
