name: Review deploy

# Deploy of the owner review tool to staging at review.wispel.cc, by hand from main (ADR 0116,
# REQ-REV-005). Run `Staging deploy` first: it applies the database migrations this tool reads.
# The GitHub environment `staging` supplies:
#   secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (the token also edits Workers routes
#            on the wispel.cc zone)
#   variables: REVIEW_ACCESS_TEAM_DOMAIN, REVIEW_ACCESS_AUD (from the Cloudflare Access
#              application; not secrets)
# See docs/kt/operations.md.

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: review-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only the reviewed code on main goes to staging.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require green checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Staging only gets a commit whose pull request checks passed (REQ-NFR-021).
          for check in parse toolchain; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$check&filter=latest" --jq '.check_runs | sort_by(.completed_at) | last | .conclusion')
            if [ "$conclusion" != "success" ]; then
              echo "::error::The check '$check' has no successful run for $GITHUB_SHA (found: ${conclusion:-none})"
              exit 1
            fi
          done

      - name: Require the Access settings
        env:
          ACCESS_TEAM_DOMAIN: ${{ vars.REVIEW_ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.REVIEW_ACCESS_AUD }}
        run: |
          # Without them the API refuses every request (REQ-REV-005), so stop before deploying.
          if [[ ! "$ACCESS_TEAM_DOMAIN" =~ ^[a-z0-9-]+\.cloudflareaccess\.com$ ]] || [ -z "$ACCESS_AUD" ]; then
            echo "::error::Set REVIEW_ACCESS_TEAM_DOMAIN (<team>.cloudflareaccess.com) and REVIEW_ACCESS_AUD in the variables of the environment staging"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy the Worker
        working-directory: apps/review
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.REVIEW_ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.REVIEW_ACCESS_AUD }}
        run: |
          pnpm exec wrangler deploy --env staging \
            --var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN" \
            --var "ACCESS_AUD:$ACCESS_AUD" \
            --message "Deploy ${GITHUB_SHA::7} from GitHub Actions"

      - name: Show the live deployment
        working-directory: apps/review
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deployments list --env staging
