name: Staging bootstrap

# Manual run that compares the staging Cloudflare account with the resources the
# project needs and, with `apply`, creates the missing ones (REQ-NFR-020, ADR 0020).
# It uses the GitHub environment `staging`, whose secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID are listed in docs/kt/operations.md. Running it twice
# creates nothing the second time.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Create the missing resources (otherwise only report drift)"
        type: boolean
        default: false
      fail_on_drift:
        description: "Fail when resources are missing (used by the automated pipeline). With apply, the run fails only if resources are still missing after apply"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # With apply the plan only reports: the next step creates what is missing, and the
      # last step fails the job if anything is still missing afterwards.
      - name: Report drift
        env:
          FAIL_ON_DRIFT: ${{ inputs.fail_on_drift }}
          APPLY: ${{ inputs.apply }}
        run: |
          flag=""
          if [ "$FAIL_ON_DRIFT" = "true" ] && [ "$APPLY" != "true" ]; then flag="--fail-on-drift"; fi
          node infrastructure/cloudflare/dist/bootstrap-cli.js --env staging $flag

      - name: Create missing resources
        if: ${{ inputs.apply }}
        run: node infrastructure/cloudflare/dist/bootstrap-cli.js --env staging --apply

      - name: Verify no drift remains
        if: ${{ inputs.apply }}
        run: node infrastructure/cloudflare/dist/bootstrap-cli.js --env staging --fail-on-drift
