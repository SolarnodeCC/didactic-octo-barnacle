name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Corepack runs first so setup-node finds pnpm for the store cache.
      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.2 --activate

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          # The pnpm store, keyed on pnpm-lock.yaml; no secrets or build output.
          cache: pnpm

      # Again on Node 24, so the pnpm shim belongs to the Node that runs the build.
      - name: Bind pnpm to Node 24
        run: |
          corepack enable
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit:ci

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # One build: the root `typecheck` and `test:unit` scripts rebuild @roi/models for
      # local use, which CI does not need after this step.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Unit tests
        run: pnpm -r run test:unit

      - name: Traceability
        run: |
          python3 -m pip install --disable-pip-version-check -q -r scripts/requirements.txt
          pnpm check:traceability
