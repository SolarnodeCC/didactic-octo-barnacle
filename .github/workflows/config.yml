name: Configuration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse JSON, YAML, and rule frontmatter
        run: |
          python3 -m pip install --disable-pip-version-check -q pyyaml
          python3 - << 'PY'
          import json, pathlib, sys
          import yaml
          root = pathlib.Path(".")
          json_files = [p for p in root.rglob("*.json") if ".git" not in p.parts]
          yaml_files = [p for p in list(root.rglob("*.yml")) + list(root.rglob("*.yaml")) if ".git" not in p.parts]
          mdc_files = list(root.glob(".cursor/rules/*.mdc"))
          if not json_files or not yaml_files or not mdc_files:
              sys.exit("expected json, yaml, and mdc files")
          for path in json_files:
              json.loads(path.read_text())
              print(f"json ok {path}")
          for path in yaml_files:
              yaml.safe_load(path.read_text())
              print(f"yaml ok {path}")
          for path in mdc_files:
              text = path.read_text()
              if not text.startswith("---\n"):
                  sys.exit(f"{path} is missing frontmatter")
              end = text.find("\n---\n", 4)
              if end == -1:
                  sys.exit(f"{path} frontmatter does not close")
              front = text[4:end]
              for key in ("description:", "alwaysApply:"):
                  if key not in front:
                      sys.exit(f"{path} is missing {key}")
              print(f"mdc ok {path}")
          PY
      - name: Run environment install
        run: |
          python3 - << 'PY'
          import json, pathlib, subprocess, sys
          install = json.loads(pathlib.Path(".cursor/environment.json").read_text())["install"]
          for n in (1, 2):
              result = subprocess.run(["bash", "-lc", install])
              print(f"install_run_{n}={result.returncode}")
              if result.returncode != 0:
                  sys.exit(result.returncode)
          PY
