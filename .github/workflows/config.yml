name: Configuration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Corepack runs first so setup-node finds pnpm for the store cache.
      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.2 --activate

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          # The pnpm store, keyed on pnpm-lock.yaml; no secrets or build output.
          cache: pnpm

      # Again on Node 24, so the pnpm shim belongs to the Node that runs the build.
      - name: Bind pnpm to Node 24
        run: |
          corepack enable
          node --version
          pnpm --version

      - name: Parse JSON, YAML, and rule frontmatter
        run: |
          python3 -m pip install --disable-pip-version-check -q -r scripts/requirements.txt
          python3 scripts/check-config.py

      - name: Check KT documents
        run: python3 scripts/check-kt.py

      - name: Check golden sets
        run: python3 scripts/check-golden-sets.py

      - name: Check repository hardening
        run: python3 scripts/check-hardening.py

      - name: Run environment install
        run: |
          python3 - << 'PY'
          import json, pathlib, subprocess, sys
          install = json.loads(pathlib.Path(".cursor/environment.json").read_text())["install"]
          for n in (1, 2):
              result = subprocess.run(["bash", "-lc", install])
              print(f"install_run_{n}={result.returncode}")
              if result.returncode != 0:
                  sys.exit(result.returncode)
          PY
